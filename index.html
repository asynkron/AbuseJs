<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>abuse.js</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #9aa;
      }
      #stage { display: block; }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 0.5rem;
        text-align: center;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        pointer-events: none;
        transition: opacity 250ms ease;
      }
      #boot.hidden { opacity: 0; }

      /* The title screen. Labels are the original's own, from english.lsp. */
      #title {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: grid;
        place-items: center;
        background: #05060a center/cover no-repeat url('start.webp');
        transition: opacity 400ms ease;
      }
      #title.hidden { opacity: 0; pointer-events: none; }
      /*
       * `#title` above is an id, so it outranks the browser's own
       * `[hidden] { display: none }` and the attribute in the markup would
       * otherwise do nothing at all. That is not cosmetic: the screen is
       * `position: fixed` at `z-index: 20`, so whenever it is meant to be
       * hidden but is not, it covers the running game and swallows every click.
       */
      #title[hidden] { display: none; }
      #title::after {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 50% 42%, transparent 30%, #05060acc 78%);
        pointer-events: none;
      }
      #menu {
        position: relative;
        z-index: 1;
        display: grid;
        gap: 10px;
        margin-top: 44vh;
        justify-items: center;
        font-size: 15px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      #menu button {
        appearance: none;
        border: 1px solid #ffffff1c;
        background: #0a0c12b0;
        color: #b9c4cf;
        font: inherit;
        letter-spacing: inherit;
        text-transform: inherit;
        padding: 9px 26px;
        min-width: 20rem;
        cursor: pointer;
        transition: background 120ms, color 120ms, border-color 120ms;
      }
      #menu button:hover,
      #menu button:focus-visible {
        background: #f0662a22;
        border-color: #f0662a88;
        color: #ffd9c2;
        outline: none;
      }
      #menu button[disabled] { opacity: 0.35; cursor: default; }
      #menu .difficulty {
        display: flex;
        gap: 6px;
        margin-top: 14px;
      }
      #menu .difficulty button { min-width: 0; padding: 7px 14px; font-size: 12px; }
      #menu .difficulty button[aria-pressed='true'] {
        background: #f0662a33;
        border-color: #f0662abb;
        color: #ffd9c2;
      }
      #title .hint {
        position: relative;
        z-index: 1;
        margin-top: 18px;
        font-size: 11px;
        letter-spacing: 0.1em;
        color: #6a7480;
      }
      /* Top-left: the bottom belongs to the game's own status bar now. */
      #hud {
        position: fixed;
        z-index: 10;
        left: 10px;
        top: 8px;
        font-size: 11px;
        color: #6f7f8f;
        white-space: pre;
        pointer-events: none;
        text-shadow: 0 1px 0 #000;
        /* Stop long lines running under the controls panel opposite. */
        max-width: calc(100vw - 290px);
        overflow: hidden;
      }

      #controls {
        position: fixed;
        z-index: 10;
        top: 10px;
        right: 10px;
        display: grid;
        gap: 6px;
        padding: 9px 11px;
        font-size: 10px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #7e8fa0;
        background: rgba(6, 10, 16, 0.72);
        border: 1px solid rgba(120, 150, 175, 0.22);
        border-radius: 4px;
        backdrop-filter: blur(3px);
      }
      #controls .row {
        display: grid;
        grid-template-columns: 62px 108px 34px;
        align-items: center;
        gap: 8px;
      }
      #controls .val {
        text-align: right;
        color: #9fb4c6;
        font-variant-numeric: tabular-nums;
      }
      #controls input[type='range'] {
        -webkit-appearance: none;
        appearance: none;
        width: 108px;
        height: 3px;
        background: rgba(140, 170, 195, 0.28);
        border-radius: 2px;
        outline: none;
        cursor: pointer;
      }
      #controls input[type='range']::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: #b9cddc;
        border: 1px solid #050a10;
      }
      #controls input[type='range']::-moz-range-thumb {
        width: 11px;
        height: 11px;
        border: 1px solid #050a10;
        border-radius: 50%;
        background: #b9cddc;
      }
      #controls button {
        font: inherit;
        letter-spacing: inherit;
        text-transform: inherit;
        color: #7e8fa0;
        padding: 3px 0;
        background: rgba(140, 170, 195, 0.1);
        border: 1px solid rgba(120, 150, 175, 0.22);
        border-radius: 3px;
        cursor: pointer;
      }
      #controls button:hover {
        color: #cfe0ec;
        background: rgba(140, 170, 195, 0.2);
      }
    </style>
  </head>
  <body>
    <div id="boot">loading&hellip;</div>
    <div id="title" hidden>
      <div id="menu">
        <button id="start-new" type="button">Start New Game</button>
        <button id="start-load" type="button" disabled>Load Saved Game</button>
        <div class="difficulty" role="group" aria-label="Difficulty">
          <button type="button" data-difficulty="easy" aria-pressed="false">Wimp</button>
          <button type="button" data-difficulty="medium" aria-pressed="false">Easy</button>
          <button type="button" data-difficulty="hard" aria-pressed="true">Normal</button>
          <button type="button" data-difficulty="extreme" aria-pressed="false">Extreme</button>
        </div>
        <p class="hint">Arrow keys or mouse &middot; Enter to begin</p>
      </div>
    </div>
    <div id="controls" hidden>
      <div class="row">
        <label for="brightness">Brightness</label>
        <input id="brightness" type="range" min="0.4" max="2" step="0.01" value="1.05" />
        <span class="val" id="brightness-val">1.05</span>
      </div>
      <div class="row">
        <label for="contrast">Contrast</label>
        <input id="contrast" type="range" min="0.4" max="2.5" step="0.01" value="1.21" />
        <span class="val" id="contrast-val">1.21</span>
      </div>
      <div class="row">
        <label for="glow">Glow</label>
        <input id="glow" type="range" min="0" max="2" step="0.01" value="2" />
        <span class="val" id="glow-val">2.00</span>
      </div>
      <div class="row">
        <label for="roundness">Round pixels</label>
        <input id="roundness" type="range" min="0" max="1" step="0.01" value="0" />
        <span class="val" id="roundness-val">0.00</span>
      </div>
      <div class="row">
        <label for="volume">Volume</label>
        <input id="volume" type="range" min="0" max="1" step="0.01" value="0.5" />
        <span class="val" id="volume-val">0.50</span>
      </div>
      <button id="reset-levels" type="button">Reset</button>
    </div>
    <div id="hud"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
