<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>abuse.js</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #9aa;
      }
      #stage { display: block; }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 0.5rem;
        text-align: center;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        pointer-events: none;
        transition: opacity 250ms ease;
      }
      #boot.hidden { opacity: 0; }
      #hud {
        position: fixed;
        z-index: 10;
        left: 10px;
        bottom: 8px;
        font-size: 11px;
        color: #6f7f8f;
        white-space: pre;
        pointer-events: none;
        text-shadow: 0 1px 0 #000;
      }

      #controls {
        position: fixed;
        z-index: 10;
        top: 10px;
        right: 10px;
        display: grid;
        gap: 6px;
        padding: 9px 11px;
        font-size: 10px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #7e8fa0;
        background: rgba(6, 10, 16, 0.72);
        border: 1px solid rgba(120, 150, 175, 0.22);
        border-radius: 4px;
        backdrop-filter: blur(3px);
      }
      #controls .row {
        display: grid;
        grid-template-columns: 62px 108px 34px;
        align-items: center;
        gap: 8px;
      }
      #controls .val {
        text-align: right;
        color: #9fb4c6;
        font-variant-numeric: tabular-nums;
      }
      #controls input[type='range'] {
        -webkit-appearance: none;
        appearance: none;
        width: 108px;
        height: 3px;
        background: rgba(140, 170, 195, 0.28);
        border-radius: 2px;
        outline: none;
        cursor: pointer;
      }
      #controls input[type='range']::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: #b9cddc;
        border: 1px solid #050a10;
      }
      #controls input[type='range']::-moz-range-thumb {
        width: 11px;
        height: 11px;
        border: 1px solid #050a10;
        border-radius: 50%;
        background: #b9cddc;
      }
      #controls button {
        font: inherit;
        letter-spacing: inherit;
        text-transform: inherit;
        color: #7e8fa0;
        padding: 3px 0;
        background: rgba(140, 170, 195, 0.1);
        border: 1px solid rgba(120, 150, 175, 0.22);
        border-radius: 3px;
        cursor: pointer;
      }
      #controls button:hover {
        color: #cfe0ec;
        background: rgba(140, 170, 195, 0.2);
      }
    </style>
  </head>
  <body>
    <div id="boot">loading&hellip;</div>
    <div id="controls" hidden>
      <div class="row">
        <label for="brightness">Brightness</label>
        <input id="brightness" type="range" min="0.4" max="2" step="0.01" value="1" />
        <span class="val" id="brightness-val">1.00</span>
      </div>
      <div class="row">
        <label for="contrast">Contrast</label>
        <input id="contrast" type="range" min="0.4" max="2.5" step="0.01" value="1" />
        <span class="val" id="contrast-val">1.00</span>
      </div>
      <button id="reset-levels" type="button">Reset</button>
    </div>
    <div id="hud"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
