name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The generated assets are gitignored, so the site is built from
# assets/original/ on every run rather than committed. That is the whole point
# of the converter: the repo holds Abuse's shipped data, not a derivative of it.

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; queue rather than cancel, so a push mid-deploy still
# ends up published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Convert the Abuse data
        run: npm run assets

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
